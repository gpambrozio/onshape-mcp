name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          # Nothing may open a browser or wait on a human in CI.
          ONSHAPE_MCP_NO_BROWSER: "1"
          ONSHAPE_MCP_SIGNIN_WAIT_MS: "500"
      - run: npm run build

  bundle:
    name: desktop bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb-bundle
          path: "*.mcpb"
