name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Required for npm provenance and for MCP registry authentication.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          ONSHAPE_MCP_NO_BROWSER: "1"
          ONSHAPE_MCP_SIGNIN_WAIT_MS: "500"
      - run: npm run build

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $pkg" >&2
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build the Claude Desktop bundle
        run: npm run bundle

      - name: Publish to the MCP registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Attach the bundle to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.mcpb"
          generate_release_notes: true
