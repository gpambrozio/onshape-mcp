name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # OIDC token for npm trusted publishing and for the MCP registry login.
  # No npm token is stored anywhere in this repository.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          ONSHAPE_MCP_NO_BROWSER: "1"
          ONSHAPE_MCP_SIGNIN_WAIT_MS: "500"
      - run: npm run build

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $pkg" >&2
            exit 1
          fi

      # Authenticated by OIDC through the trusted publisher configured on
      # npmjs.com — no NODE_AUTH_TOKEN. Provenance is attached automatically.
      # The version check keeps the job idempotent, so a tag can be re-run after
      # a manual bootstrap publish without failing on EPUBLISHCONFLICT.
      - name: Publish to npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm — skipping publish."
          else
            npm publish --access public
          fi

      # npm accepts a publish before it serves it, and the MCP registry checks npm
      # the moment we ask it to register: a 404 there fails the release after the
      # package is already out, which is how 0.1.1 and 0.1.2 got stranded.
      - name: Wait for npm to serve the new version
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 30); do
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is live on npm."
              exit 0
            fi
            echo "Attempt $attempt: not visible yet, waiting 20s."
            sleep 20
          done
          echo "$name@$version never appeared on npm after 10 minutes." >&2
          exit 1

      - name: Build the Claude Desktop bundle
        run: npm run bundle

      - name: Publish to the MCP registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Attach the bundle to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.mcpb"
          generate_release_notes: true
